<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arkeos Terminal — Execution Intelligence for Solana TCGs</title>
  <meta name="description" content="Real-time execution intelligence for Solana trading card games. Track liquidity, catch alpha early, and execute with an edge. Join the Arkeos Terminal waitlist." />

  <!-- Open Graph / Twitter -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Arkeos Terminal" />
  <meta property="og:description" content="Execution intelligence for Solana TCGs. Join the waitlist." />
  <meta property="og:image" content="/assets/tplogo.svg" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Arkeos Terminal" />
  <meta name="twitter:description" content="Execution intelligence for Solana TCGs. Join the waitlist." />
  <meta name="twitter:image" content="/assets/logo.jpeg" />

  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />

  <!--
    Font note: the source design specs "Eurostile Round" (display) and "Canva Sans" (UI/button).
    Neither can be legally self-hosted here — Eurostile Round is a paid URW++ typeface, and Canva
    Sans is licensed only for use inside Canva-exported designs, not as a live webfont. Orbitron
    and Poppins are used as close, free (Google Fonts / OFL) stand-ins. See README for how to swap
    in the real fonts if you buy a webfont license for Eurostile Round.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['Orbitron', 'sans-serif'], // stand-in for Eurostile Round
            ui: ['Poppins', 'sans-serif'],        // stand-in for Canva Sans
          },
          colors: {
            'arkeos-blue': '#0300bb',
            'arkeos-indigo': '#302ebb',
          },
        },
      },
    };
  </script>

  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" type="image/png" href="logo.png">
</head>
<body class="bg-black text-white font-ui antialiased overflow-x-hidden">

  <!-- Ambient corner glow, sits behind all content -->
  <div class="arkeos-glow" aria-hidden="true"></div>

  <main class="relative z-10 min-h-screen flex flex-col items-center justify-center px-6 py-16 sm:py-20 text-center">

    <!-- Logo mark -->
    <img
      src="logo.png"
      alt="Arkeos Terminal"
      width="697"
      height="627"
      class="w-28 sm:w-36 md:w-44 h-auto mb-7 sm:mb-9 select-none"
      draggable="false"
    />

    <!-- Wordmark -->
    <h1 class="font-display font-bold uppercase leading-[1.2] text-[1.75rem] tracking-[0.16em] sm:text-4xl sm:tracking-[0.26em] md:text-6xl md:tracking-[0.32em]">
      <span class="block">Arkeos</span>
      <span class="block">Terminal</span>
    </h1>

    <!-- Tagline -->
    <p class="font-display text-gray-300 mt-5 sm:mt-6 text-[0.65rem] tracking-[0.1em] sm:text-sm sm:tracking-[0.16em] md:text-base md:tracking-[0.2em]">
      execution intelligence for solana <span class="uppercase">TCGs</span>.
    </p>

    <!-- Waitlist -->
    <div class="w-full max-w-md mt-12 sm:mt-16">
      <p class="font-ui font-bold text-lg sm:text-xl mb-5">Join The Waitlist:</p>

      <form id="waitlist-form" novalidate class="flex flex-col sm:flex-row gap-3">
        <label for="email" class="sr-only">Email address</label>
        <input
          id="email"
          name="email"
          type="email"
          inputmode="email"
          autocomplete="email"
          required
          placeholder="you@email.com"
          class="arkeos-input flex-1 min-w-0 bg-black rounded-2xl px-6 py-4 text-sm sm:text-base text-white placeholder-gray-500 focus:outline-none transition-shadow"
        />
        <button
          type="submit"
          id="join-btn"
          class="arkeos-button shrink-0 rounded-2xl px-9 py-4 font-ui font-semibold uppercase tracking-wide text-sm sm:text-base transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
        >
          Join
        </button>
      </form>

      <p id="form-status" role="status" aria-live="polite" class="font-ui mt-4 text-sm min-h-[1.25em]"></p>
    </div>
  </main>

  <script src="waitlist.js"></script>
</body>
</html>
