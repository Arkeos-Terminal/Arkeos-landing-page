<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You're On The List — Arkeos Terminal</title>
  <meta name="robots" content="noindex" />

  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['Orbitron', 'sans-serif'],
            ui: ['Poppins', 'sans-serif'],
          },
          colors: {
            'arkeos-blue': '#0300bb',
            'arkeos-indigo': '#302ebb',
          },
        },
      },
    };
  </script>

  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-black text-white font-ui antialiased overflow-x-hidden">

  <div class="arkeos-glow" aria-hidden="true"></div>

  <main class="relative z-10 min-h-screen flex flex-col items-center justify-center px-6 py-16 sm:py-20 text-center">

    <img
      src="assets/logo.png"
      alt="Arkeos Terminal"
      width="697"
      height="627"
      class="w-20 sm:w-24 h-auto mb-6 select-none"
      draggable="false"
    />

    <h1 class="font-display font-bold uppercase text-2xl sm:text-4xl tracking-[0.1em] sm:tracking-[0.16em]">You're On The List.</h1>
    <p class="font-ui text-gray-400 mt-3 text-sm sm:text-base max-w-sm">Refer other traders to move up the queue.</p>

    <div class="w-full max-w-md mt-10 text-left">

      <!-- Referral link -->
      <div class="flex items-center gap-3">
        <label for="referral-link" class="sr-only">Your referral link</label>
        <input
          id="referral-link"
          type="text"
          readonly
          class="arkeos-input flex-1 min-w-0 bg-black border border-[#302ebb] rounded-2xl px-5 py-3.5 text-xs sm:text-sm text-white truncate"
        />
        <button
          id="copy-btn"
          class="arkeos-button shrink-0 bg-black border border-white/90 rounded-2xl px-6 py-3.5 font-ui font-semibold uppercase tracking-wide text-xs sm:text-sm hover:bg-white hover:text-black transition-colors"
        >
          Copy
        </button>
      </div>
      <p id="copy-status" class="text-xs text-gray-500 mt-2 h-4"></p>

      <!-- Share actions -->
      <div class="flex flex-col sm:flex-row gap-3 mt-4">
        <a id="share-x" href="#" target="_blank" rel="noopener" class="share-btn share-btn-x flex-1">
          <svg viewBox="0 0 24 24" class="w-4 h-4" fill="currentColor" aria-hidden="true"><path d="M18.9 2H22l-7.6 8.7L23.3 22h-7.1l-5.5-7.2L4.3 22H1.2l8.1-9.3L1 2h7.3l5 6.6L18.9 2zm-1.2 18h1.9L7.4 3.9H5.4L17.7 20z"/></svg>
          Post on X
        </a>
        <button id="share-send" class="share-btn share-btn-send flex-1">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4" aria-hidden="true"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
          Send Link
        </button>
      </div>
    </div>
  </main>

  <script src="refer.js"></script>
</body>
</html>
